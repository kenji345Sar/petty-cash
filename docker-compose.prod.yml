services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: petty_cash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    ports:
      - "5141:5141"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=petty_cash;Username=postgres;Password=postgres"
      ASPNETCORE_ENVIRONMENT: Production
      CorsOrigins__0: "http://localhost:8080"
      CorsOrigins__1: "http://localhost"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_API_BASE: "/api"
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
